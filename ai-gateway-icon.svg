<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AI Gateway" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2a0508"/>
      <stop offset="0.6" stop-color="#0d0203"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="0.55" stop-color="#e11d2e"/>
      <stop offset="1" stop-color="#8a0a14"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity=".9"/>
      <stop offset="0.5" stop-color="#5a0a10" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff1f2f" stop-opacity=".8"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2f2"/>
      <stop offset="0.35" stop-color="#ff6a6a"/>
      <stop offset="1" stop-color="#e11d2e"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- badge -->
  <rect x="4" y="4" width="248" height="248" rx="64" fill="url(#bg)"/>
  <rect x="5" y="5" width="246" height="246" rx="63" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- ripple pulse -->
  <circle cx="128" cy="128" r="30" fill="none" stroke="#ff2a3a" stroke-width="2" opacity="0">
    <animate attributeName="r" values="30;100" dur="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.6 0.4 1"/>
    <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- outer ring -->
  <g filter="url(#glow)">
    <g>
      <circle cx="128" cy="128" r="84" fill="none" stroke="url(#red)" stroke-width="10" stroke-linecap="round" stroke-dasharray="290 60 40 137.8"/>
      <animateTransform attributeName="transform" type="rotate" values="0 128 128;360 128 128" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- inner ring, counter-rotating -->
  <g>
    <circle cx="128" cy="128" r="58" fill="none" stroke="#ff2a3a" stroke-opacity=".85" stroke-width="5" stroke-linecap="round" stroke-dasharray="150 40 90 84.4"/>
    <animateTransform attributeName="transform" type="rotate" values="360 128 128;0 128 128" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- orbiting dot -->
  <g filter="url(#glow)">
    <g>
      <circle cx="128" cy="44" r="6" fill="#fff"/>
      <animateTransform attributeName="transform" type="rotate" values="0 128 128;360 128 128" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- core sparkle -->
  <g transform="translate(128 128)" filter="url(#glow)">
    <g>
      <g>
        <path d="M0 -34 C0 -10 10 0 34 0 C10 0 0 10 0 34 C0 10 -10 0 -34 0 C-10 0 0 -10 0 -34 Z" fill="url(#core)"/>
        <animateTransform attributeName="transform" type="scale" values="0.85;1.12;0.85" dur="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" values="0;90" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
